services:
  db:
    image: mysql:8.0
    container_name: codeflow_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: codeflow
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: codeflow_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: codeflow
      JWT_SECRET: your_super_secret_key_123
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: codeflow_frontend
    ports:
      - "3001:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  mysql_data:
